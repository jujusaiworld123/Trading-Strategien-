services:
  - type: web
    name: alpaca-backtesting-mcp
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_PAPER_TRADE
        value: "true"
      - key: LOG_LEVEL
        value: INFO
