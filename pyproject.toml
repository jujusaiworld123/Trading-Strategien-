[project]
name = "multi-provider-backtesting-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pandas>=2", "httpx>=0.27"]

[project.optional-dependencies]
alpaca = ["alpaca-py>=0.30"]
databento = ["databento>=0.50"]
mcp = ["mcp>=1"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

