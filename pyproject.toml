[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alpaca-backtesting-mcp"
version = "0.1.0"
description = "Read-only Alpaca market-data and deterministic backtesting MCP server"
requires-python = ">=3.12"
dependencies = [
  "alpaca-py>=0.42,<1",
  "mcp>=1.12,<2",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
ignore_missing_imports = true
disallow_untyped_decorators = false
